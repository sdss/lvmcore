schema:
- name: keyword
  dtype: str
  description: Keyword to specify ignored exposures, either 'mjd', 'tileid', 'expnum'
- name: value
  dtype: str
  description: Value specification, follows conventions x; xi-xf; xi-; -xf; x1,...,xn
- name: reason
  dtype: str
  description: Categorized reason why these exposures should be ignored e.g., 'Engineering run', 'Test run'
- name: comment
  dtype: str
  description: Additional remarks about the excluded exposures
