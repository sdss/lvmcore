schemas:
- name: epochs
  dtype: dict[int, dict]
  description: Dictionary mapping epoch MJD to its calibration metadata
  keyschemas:
  - name: sources
    dtype: dict[int, list[str]]
    description: Dictionary mapping source MJD to list of calibration types (e.g.,
      bias, dome, arc, twilight)
  - name: trigger
    dtype: str
    description: Reason for which these calibrations were taken, e.g., 'Early-science',
      'Survey start', 'Instrument intervention', etc.
  - name: comment
    dtype: str | null
    description: Optional comment providing more context about the calibration epoch
